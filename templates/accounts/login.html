{% extends "accounts/base.html" %}
{% block content %}
<h1>تسجيل الدخول</h1>
<p class="lead">للطاقم فقط. الدخول محمي بالتحقق الثنائي.</p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" novalidate>
  {% csrf_token %}
  <div class="form-row"><label for="id_username">{{ form.username.label }}</label><input type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}" dir="auto"></div>
  <div class="form-row"><label for="id_password">{{ form.password.label }}</label><input type="password" name="password" id="id_password" autocomplete="current-password" required dir="ltr"></div>
  <button class="btn primary block" type="submit">دخول</button>
</form>
<p class="small muted" style="margin-top:16px">{{ "shield"|icon:14 }} بعد عدة محاولات خاطئة يُقفل الحساب مؤقتاً، وتُسجَّل كل محاولة في سجل التدقيق.</p>
{% endblock %}
