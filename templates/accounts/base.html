{% load static %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>{% block title %}الدخول{% endblock %} · {{ site.short_name }}</title>
<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/studio.css' %}">
<style>:root{--primary:{{ site.primary_color }}}</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">{{ "pigeon"|icon:22 }}</span><span>{{ site.name }}<br><span class="small muted" style="font-weight:400">غرفة التحرير</span></span></div>
    {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
