{% load static %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>{% block title %}الدخول{% endblock %} · {{ site.short_name }}</title>
<link rel="stylesheet" href="{% static 'css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'css/studio.css' %}">
<style>:root{--primary:{{ site.primary_color }}}</style>
<link rel="icon" href="{% if site.logo %}{{ site.logo.thumb }}{% else %}{% static 'img/icon-192.png' %}{% endif %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">{% if site.logo %}<img class="auth-logo" src="{{ site.logo.url }}" alt="{{ site.name }}">{% else %}<span class="mark">{{ "pigeon"|icon:22 }}</span>{% endif %}<span>{% if not site.logo %}{{ site.name }}<br>{% endif %}<span class="small muted" style="font-weight:400">غرفة التحرير</span></span></div>
    {% for m in messages %}<div class="alert {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
