# تثبيت دون Docker مع nginx (استخدم certbot للشهادة). الوسائط تُخدم مباشرة من القرص.
server {
    listen 80;
    server_name news.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name news.example.org;
    ssl_certificate     /etc/letsencrypt/live/news.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.org/privkey.pem;

    # لا نحتفظ بعناوين القرّاء في السجلات.
    access_log off;
    client_max_body_size 60m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /media/ {
        alias /srv/arcms/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
