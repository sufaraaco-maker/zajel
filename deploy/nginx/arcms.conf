# تثبيت دون Docker مع nginx (استخدم certbot للشهادة). الوسائط والملفات الثابتة تُخدم مباشرة من القرص.
#
# ذاكرة الصفحات (micro-cache): صفحات القرّاء تُحفظ هنا ثوانيَ قليلة (يحددها التطبيق بـ s-maxage)،
# فيخدم nginx آلاف القرّاء في الثانية من الذاكرة ويصل التطبيقَ طلبٌ واحد لكل صفحة كل بضع ثوانٍ.
# لا يُحفظ إلا ما يسمح به التطبيق صراحة (Cache-Control: public)، ولا شيء لمن معه جلسة (الطاقم).
# قياسات هذا الإعداد وطريقة اختباره في docs/LOADTEST.md.
proxy_cache_path /var/cache/nginx/arcms levels=1:2 keys_zone=arcms_pages:20m max_size=512m inactive=10m use_temp_path=off;
map $http_cookie $arcms_private {
    default 0;
    "~*(arcms_session|messages)=" 1;
}

server {
    listen 80;
    server_name news.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name news.example.org;
    ssl_certificate     /etc/letsencrypt/live/news.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.org/privkey.pem;

    # لا نحتفظ بعناوين القرّاء في السجلات.
    access_log off;
    client_max_body_size 60m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /media/ {
        alias /srv/arcms/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # أسماء الملفات الثابتة تحمل بصمة محتواها (collectstatic)، فتُحفظ عند القارئ سنة كاملة.
    location /static/ {
        alias /opt/arcms/staticfiles/;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        proxy_cache arcms_pages;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_bypass $arcms_private;
        proxy_no_cache $arcms_private;
        # زحام على صفحة لم تُحفظ بعد: طلب واحد يبنيها والباقون ينتظرونه
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # إن تعطل التطبيق لحظة يرى القرّاء آخر نسخة بدل صفحة خطأ
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }
}
